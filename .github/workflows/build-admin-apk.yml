name: Build MarPatients Admin APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'admin_app/**'
      - '.github/workflows/build-admin-apk.yml'
jobs:
  build-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android shell
        working-directory: admin_app
        run: flutter create --platforms android --project-name marpatients_admin --org com.marshalenterprise .
      - name: Allow HTTPS API access on Android
        working-directory: admin_app
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              start = s.index('<manifest')
              pos = s.index('>', start) + 1
              s = s[:pos] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + s[pos:]
              p.write_text(s)
          PYCODE
      - name: Set display name and original icon
        working-directory: admin_app
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil, re
          p = Path('android/app/src/main/AndroidManifest.xml')
          p.write_text(re.sub(r'android:label="[^"]*"', 'android:label="MarPatients Admin"', p.read_text(), count=1))
          for source in Path('assets/icons').glob('mipmap-*/ic_launcher.png'):
              dest = Path('android/app/src/main/res') / source.parent.name / 'ic_launcher.png'
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, dest)
          PYCODE
      - name: Install dependencies
        working-directory: admin_app
        run: flutter pub get
      - name: Build admin APK
        working-directory: admin_app
        env:
          MAR_API_URL: ${{ vars.MAR_API_URL }}
        run: |
          if [ -z "$MAR_API_URL" ]; then echo "DEMO MODE: MAR_API_URL not set; changes stay on device"; fi
          flutter build apk --release --dart-define=MAR_API_URL="$MAR_API_URL"
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: MarPatients-Admin-APK
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
