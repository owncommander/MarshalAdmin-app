name: Build MarPatients Admin APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'admin_app/**'
      - '.github/workflows/build-admin-apk.yml'
jobs:
  build-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android shell
        working-directory: admin_app
        run: flutter create --platforms android --project-name marpatients_admin --org com.marshalenterprise .
      - name: Configure Android manifest and icon
        working-directory: admin_app
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil, re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              pos = s.index('>', s.index('<manifest')) + 1
              s = s[:pos] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + s[pos:]
          p.write_text(re.sub(r'android:label="[^"]*"', 'android:label="MarPatients Admin"', s, count=1))
          for source in Path('assets/icons').glob('mipmap-*/ic_launcher.png'):
              dest = Path('android/app/src/main/res') / source.parent.name / 'ic_launcher.png'
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, dest)
          PYCODE
      - name: Install dependencies
        working-directory: admin_app
        run: flutter pub get
      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo 'SUPABASE_URL secret missing' && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo 'SUPABASE_PUBLISHABLE_KEY secret missing' && exit 1)
      - name: Build admin APK
        working-directory: admin_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: MarPatients-Admin-APK
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
